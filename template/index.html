<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>House 01 — a walkthrough template</title>
<meta name="description" content="A neutral three-beat 3D walkthrough for a residential project: street reveal, roof terrace, infinity pool.">
<link rel="preload" href="../assets/fonts/TimelessSansVF.woff2" as="font" type="font/woff2" crossorigin>
<style>
  @font-face {
    font-family: 'Timeless Sans';
    src: url('../assets/fonts/TimelessSansVF.woff2') format('woff2-variations');
    font-weight: 100 900;
    font-display: swap;
  }
  :root {
    --ink: #ffffff;
    --paper: #f5f5f7;
    --runway: 340;
    --ease: cubic-bezier(.22, .61, .21, 1);
  }
  * { box-sizing: border-box; }
  html { background: #0e0c09; }
  body {
    margin: 0;
    font-family: 'Timeless Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0e0c09;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    overscroll-behavior-y: none;
  }
  a { color: inherit; }

  /* the track is the scroll runway; the stage is what stays on screen */
  .house {
    position: relative;
    height: calc(var(--runway) * 1svh);
    background: #0e0c09;
  }
  .house__stage {
    position: sticky;
    top: 0;
    height: 100svh;
    overflow: hidden;
    isolation: isolate;
  }
  .house__poster,
  canvas.house-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
  .house__poster {
    object-fit: cover;
    opacity: 1;
    transition: opacity .8s var(--ease);
    z-index: 0;
  }
  .house__poster.is-gone { opacity: 0; }
  canvas.house-canvas { z-index: 1; background: transparent; }

  /* a hair of grade over the canvas on the phone tier, where there is no
     post pass: warm highlights, cool shadows, a vignette */
  .house__grade {
    position: absolute; inset: 0; z-index: 2; pointer-events: none;
    background:
      radial-gradient(120% 90% at 50% 42%, rgba(0,0,0,0) 52%, rgba(10,8,6,.30) 100%),
      linear-gradient(to bottom, rgba(12,10,8,.16), rgba(0,0,0,0) 26%, rgba(0,0,0,0) 74%, rgba(12,10,8,.28));
  }

  /* ── the overlay: brand, one line, a hairline ── */
  .brand {
    position: absolute;
    z-index: 5;
    top: max(26px, env(safe-area-inset-top));
    left: clamp(20px, 3.2vw, 44px);
    font-size: 12px;
    font-weight: 500;
    letter-spacing: .22em;
    text-transform: uppercase;
    color: rgba(255,255,255,.92);
    text-shadow: 0 1px 14px rgba(0,0,0,.35);
    pointer-events: none;
  }
  .brand::after {
    content: '';
    display: block;
    width: 26px;
    height: 1px;
    margin-top: 10px;
    background: rgba(255,255,255,.5);
  }

  .copy {
    position: absolute;
    z-index: 5;
    left: clamp(20px, 5.4vw, 84px);
    bottom: clamp(64px, 13vh, 132px);
    right: clamp(20px, 5.4vw, 84px);
    pointer-events: none;
  }
  .copy__item {
    position: absolute;
    left: 0;
    bottom: 0;
    margin: 0;
    opacity: 0;
    will-change: opacity, transform;
  }
  .copy__line {
    margin: 0;
    font-size: clamp(40px, 5.2vw, 76px);
    font-weight: 500;
    line-height: .98;
    letter-spacing: -.035em;
    color: #fff;
    text-shadow: 0 2px 40px rgba(0,0,0,.28), 0 1px 10px rgba(0,0,0,.18);
    max-width: 18ch;
  }
  @media (max-width: 820px) {
    .copy { bottom: clamp(72px, 16vh, 130px); }
    .copy__line { font-size: clamp(34px, 9.2vw, 46px); letter-spacing: -.03em; }
  }

  .progress {
    position: absolute;
    z-index: 5;
    left: clamp(20px, 5.4vw, 84px);
    right: clamp(20px, 5.4vw, 84px);
    bottom: max(26px, env(safe-area-inset-bottom));
    height: 1px;
    background: rgba(255,255,255,.22);
    overflow: hidden;
    pointer-events: none;
  }
  .progress i {
    display: block;
    height: 100%;
    background: rgba(255,255,255,.85);
    transform-origin: 0 50%;
    transform: scaleX(0);
  }

  .scrollhint {
    position: absolute;
    z-index: 5;
    right: clamp(20px, 5.4vw, 84px);
    bottom: max(26px, env(safe-area-inset-bottom));
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 10px;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: rgba(255,255,255,.8);
    transition: opacity .4s linear;
    pointer-events: none;
  }
  .scrollhint i {
    display: block;
    width: 1px;
    height: 26px;
    background: linear-gradient(to bottom, rgba(255,255,255,.7), rgba(255,255,255,0));
    animation: drop 2.4s var(--ease) infinite;
  }
  @keyframes drop {
    0% { transform: scaleY(.2); transform-origin: top; opacity: 0; }
    35% { transform: scaleY(1); opacity: 1; }
    100% { transform: scaleY(1); transform-origin: bottom; opacity: 0; }
  }

  /* no WebGL, or a model-less host: the still carries the section */
  .house.no-webgl canvas { display: none; }
  .house.no-webgl .house__poster { opacity: 1 !important; display: block !important; }
  @media (prefers-reduced-motion: reduce) {
    .scrollhint i { animation: none; }
  }
</style>
</head>
<body>

<main class="house" id="house">
  <div class="house__stage">
    <img class="house__poster" src="poster.webp" alt="A limestone villa with a cedar sauna and an infinity pool at golden hour" width="780" height="1688" decoding="async">
    <canvas class="house-canvas" id="scene" role="img" aria-label="Three-dimensional walkthrough of a modern villa, from the street to the roof terrace and out over the infinity pool"></canvas>
    <div class="house__grade" aria-hidden="true"></div>

    <p class="brand" aria-hidden="true">Residence 01</p>

    <div class="copy" id="copy">
      <figure class="copy__item" data-beat="0"><h2 class="copy__line">Arrive.</h2></figure>
      <figure class="copy__item" data-beat="1"><h2 class="copy__line">The whole site.</h2></figure>
      <figure class="copy__item" data-beat="2"><h2 class="copy__line">Room to breathe.</h2></figure>
    </div>

    <div class="progress" aria-hidden="true"><i id="houseBar"></i></div>
    <div class="scrollhint" aria-hidden="true"><span>Scroll</span><i></i></div>
  </div>
</main>

<script type="module">
  import { createWalkthrough } from './scene.js';
  const host = document.getElementById('house');
  const stage = host.querySelector('.house__stage');
  createWalkthrough(stage, { scrollTarget: host }).catch((err) => {
    console.error(err);
    host.classList.add('no-webgl');
  });
</script>
</body>
</html>
